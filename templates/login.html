<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Log in — Pihole Fleet Manager</title>
<style>
:root {
  --bg: #0f1117; --surface: #1a1f2e; --border: #2d3550; --text: #e2e8f0;
  --muted: #64748b; --red: #ef4444; --red-bg: rgba(239,68,68,0.12); --blue: #3b82f6;
  --font: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: var(--bg); color: var(--text); font-family: var(--font); font-size: 14px;
  min-height: 100vh; display: flex; align-items: center; justify-content: center;
}
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 32px; width: 320px; }
h1 { font-size: 16px; margin-bottom: 4px; }
p.sub { font-size: 12px; color: var(--muted); margin-bottom: 20px; }
input[type=password] {
  width: 100%; background: var(--bg); border: 1px solid var(--border); color: var(--text);
  border-radius: 6px; padding: 9px 10px; font-size: 13px; outline: none; margin-bottom: 14px;
}
input:focus { border-color: var(--blue); }
button {
  width: 100%; background: var(--blue); border: none; color: #fff; border-radius: 6px;
  padding: 10px; font-size: 13px; font-weight: 600; cursor: pointer;
}
button:hover { background: #2563eb; }
.error { color: var(--red); background: var(--red-bg); border-radius: 6px; padding: 8px 10px; font-size: 12px; margin-bottom: 14px; }
</style>
</head>
<body>
<div class="card">
  <h1>Pihole Fleet Manager</h1>
  <p class="sub">Admin login required</p>
  {% if error %}<div class="error">{{ error }}</div>{% endif %}
  <form method="post" action="/login">
    <input type="password" name="password" placeholder="Password" autofocus>
    <button type="submit">Log in</button>
  </form>
</div>
</body>
</html>
